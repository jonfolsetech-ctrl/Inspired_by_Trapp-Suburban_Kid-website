name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: suburban_trapp_site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: suburban_trapp_site

      - name: Build Tailwind CSS
        run: npm run build
        working-directory: suburban_trapp_site

      - name: Prepare site artifact
        run: |
          mkdir -p _site/dist
          cp suburban_trapp_site/index.html _site/
          cp suburban_trapp_site/script.js _site/
          cp suburban_trapp_site/dist/styles.css _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
